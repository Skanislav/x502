[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1000
via_ir = false
# Deterministic bytecode across machines — drops the IPFS metadata hash that
# otherwise embeds machine-dependent paths into the bytecode tail. Required
# for the drift check in CI (`forge build` + extract-abis must produce the
# same bytes the committed abis.ts has).
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read", path = "../chainlink/source.js" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
